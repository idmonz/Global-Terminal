name: Quality gate

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GLOBAL_TERMINAL_HOSTED_SCHEDULER_ENABLED: "false"
      GLOBAL_TERMINAL_HOSTED_SCHEDULER_KILL_SWITCH: "true"
      GLOBAL_TERMINAL_HOSTED_SCHEDULER_VERIFIED: "false"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install API and product dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Validate workflow supply chain
        run: python scripts/validate_github_workflows.py
      - name: Validate repository harness
        run: python scripts/validate_agent_harness.py
      - name: Audit publish candidates
        run: python scripts/audit_git_publish.py
      - name: Compile Python boundaries
        run: python -m compileall -q app.py lib pages scripts tests backend
      - name: Run import smoke tests
        run: python scripts/run_smoke_tests.py
      - name: Run full Python regression suite
        run: python -m pytest -q
      - name: Export deterministic API fixtures
        run: python scripts/export_api_fixtures.py
      - name: Build and inspect source release
        shell: bash
        run: |
          python scripts/build_release_zip.py
          archive="$(find dist -maxdepth 1 -type f -name 'global_market_terminal_*.zip' -print -quit)"
          test -n "$archive"
          python scripts/inspect_release_security.py "$archive"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked web dependencies
        run: npm ci
      - name: Validate fixtures and runtime UI
        run: npm test
      - name: Lint commercial web surface
        run: npm run lint
      - name: Build production web surface
        run: npm run build
      - name: Audit high-severity dependency risk
        run: npm audit --audit-level=high

  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse every owner handoff script
        shell: powershell
        run: |
          $failures = @()
          Get-ChildItem -LiteralPath scripts -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failures += $errors | ForEach-Object { "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }
